<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Palm City</title>
<style>
  html, body { margin:0; height:100%; overflow:hidden; background:#f7c98e;
    font-family:-apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-user-select:none; user-select:none; touch-action:none; overscroll-behavior:none; }
  canvas { display:block; }
  #ui { position:fixed; inset:0; pointer-events:none; }
  .pe { pointer-events:auto; }
  #flash { position:absolute; inset:0; background:#fff; opacity:0; pointer-events:none;
    transition:opacity .45s ease-out; }
  #vignette { position:absolute; inset:0; pointer-events:none;
    background:radial-gradient(ellipse 78% 82% at center, rgba(0,0,0,0) 56%, rgba(0,0,0,.34) 100%); }

  #topbar { position:absolute; top:env(safe-area-inset-top, 0); left:0; right:0;
    display:flex; align-items:flex-start; padding:10px 12px; gap:10px; }
  #moneybox { background:rgba(20,28,24,.72); border-radius:14px; padding:8px 14px; color:#ffe9b3; }
  #money { font-size:22px; font-weight:800; letter-spacing:.5px; }
  #income { font-size:12px; color:#9fe6a0; font-weight:600; min-height:14px; }
  #palms { font-size:12px; color:#ffe24a; font-weight:700; min-height:14px; }
  #wanted { position:absolute; top:calc(58px + env(safe-area-inset-top, 0px)); left:50%;
    transform:translateX(-50%); color:#ff3b3b; font-size:24px; font-weight:900;
    text-shadow:0 1px 3px rgba(0,0,0,.6); letter-spacing:3px; pointer-events:none; }
  #missionbox { flex:1; background:rgba(20,28,24,.72); border-radius:14px; padding:8px 12px;
    color:#fff; min-width:0; }
  #mtitle { font-size:11px; color:#ffc966; font-weight:700; text-transform:uppercase; letter-spacing:1px;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #mstep { font-size:14px; font-weight:600; line-height:1.25; }
  #minimap { border-radius:12px; background:rgba(20,28,24,.72); flex:none; }
  #mute { width:36px; height:36px; border-radius:50%; border:none; flex:none;
    background:rgba(20,28,24,.72); color:#ffe9b3; font-size:16px; }
  #statsbtn { width:36px; height:36px; border-radius:50%; border:none; flex:none;
    background:rgba(20,28,24,.72); color:#ffe9b3; font-size:16px; }
  #photobtn { width:36px; height:36px; border-radius:50%; border:none; flex:none;
    background:rgba(20,28,24,.72); color:#ffe9b3; font-size:15px; }
  #photoclose { position:absolute; top:calc(14px + env(safe-area-inset-top,0px));
    right:calc(14px + env(safe-area-inset-right,0px)); display:none; padding:11px 18px; border:none;
    border-radius:22px; background:rgba(20,28,24,.82); color:#fff; font-weight:800; font-size:14px; }
  body.photo #topbar, body.photo #joy, body.photo .btn, body.photo #speedo,
  body.photo #wanted, body.photo #toast { display:none !important; }
  body.photo #photoclose { display:block; }

  #toast { position:absolute; top:28%; left:50%; transform:translateX(-50%);
    background:rgba(20,28,24,.85); color:#ffe9b3; font-size:18px; font-weight:800;
    padding:10px 22px; border-radius:24px; opacity:0; transition:opacity .25s; white-space:nowrap; }

  .btn { position:absolute; right:calc(18px + env(safe-area-inset-right, 0px)); width:84px; height:84px;
    border-radius:50%; border:none; color:#1d2a20; font-size:14px; font-weight:800; letter-spacing:.5px;
    box-shadow:0 4px 14px rgba(60,30,0,.35); display:none; }
  .btn:active { transform:scale(.94); }
  #btnA { bottom:calc(26px + env(safe-area-inset-bottom, 0px)); background:#ffd166; }
  #btnB { bottom:calc(126px + env(safe-area-inset-bottom, 0px)); background:#9fe6a0; font-size:12px;
    width:auto; min-width:84px; height:64px; border-radius:32px; padding:0 16px; }
  #brake { bottom:calc(30px + env(safe-area-inset-bottom, 0px)); right:calc(118px + env(safe-area-inset-right, 0px));
    width:76px; height:76px; background:#ff6b5c; color:#fff; font-size:13px; }
  #boost { bottom:calc(122px + env(safe-area-inset-bottom, 0px)); right:calc(118px + env(safe-area-inset-right, 0px));
    width:72px; height:72px; background:#ff9d2e; color:#3d2410; font-size:13px; }
  #speedo { position:absolute; right:calc(12px + env(safe-area-inset-right, 0px));
    top:calc(150px + env(safe-area-inset-top, 0px)); display:none;
    filter:drop-shadow(0 3px 8px rgba(0,0,0,.4)); }

  #joy { position:absolute; width:120px; height:120px; border-radius:50%;
    background:rgba(255,236,200,.16); border:2px solid rgba(255,236,200,.4); display:none; }
  #knob { position:absolute; width:54px; height:54px; border-radius:50%; left:33px; top:33px;
    background:rgba(255,209,102,.85); box-shadow:0 2px 8px rgba(60,30,0,.3); }

  #dialogue { position:absolute; left:50%; transform:translateX(-50%);
    bottom:calc(20px + env(safe-area-inset-bottom, 0px)); width:min(560px, 92vw);
    background:rgba(18,24,20,.92); border-radius:16px; padding:14px 18px 10px; color:#fff; display:none; }
  #dwho { color:#ffc966; font-weight:800; font-size:13px; text-transform:uppercase; letter-spacing:1px; }
  #dtext { font-size:16px; line-height:1.4; margin:4px 0 6px; }
  #dhint { font-size:11px; color:#8fa; text-align:right; opacity:.8; }

  #intro { position:absolute; inset:0; background:linear-gradient(180deg,#2b1a3d 0%,#b3457a 55%,#ff9d5c 100%);
    display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center;
    color:#fff; padding:24px; gap:14px; }
  #intro h1 { font-size:min(13vw, 64px); margin:0; letter-spacing:4px; color:#ffd166;
    text-shadow:0 4px 0 rgba(90,30,60,.6); }
  #intro .tag { font-size:16px; font-weight:600; color:#ffe9d0; max-width:480px; }
  #intro .blurb { font-size:14px; color:#ffd9c0; max-width:440px; }
  #intro .hint { font-size:11px; color:#e8b8a0; max-width:440px; }
  #intro button { font-size:18px; font-weight:800; letter-spacing:2px; border:none; border-radius:30px;
    padding:14px 44px; background:#ffd166; color:#3d2410; box-shadow:0 6px 18px rgba(40,10,30,.4); }
  #intro button.secondary { background:transparent; border:2px solid #ffd166; color:#ffd166;
    font-size:13px; padding:10px 28px; }
  #intro .legend { display:flex; flex-wrap:wrap; gap:6px 14px; justify-content:center; max-width:440px;
    font-size:12px; color:#ffe9d0; opacity:.92; }
  #intro .legend span { white-space:nowrap; }
  #intro button:not(.secondary) { animation:btnpulse 1.8s ease-in-out infinite; }
  @keyframes btnpulse { 0%,100% { transform:scale(1); box-shadow:0 6px 18px rgba(40,10,30,.4); }
    50% { transform:scale(1.04); box-shadow:0 8px 26px rgba(255,209,102,.5); } }
  @keyframes pop { from { transform:scale(.9); opacity:0; } to { transform:scale(1); opacity:1; } }
  .gcard, .scard, .ccard { animation:pop .18s ease-out; }

  #confirm { position:absolute; inset:0; display:none; align-items:center; justify-content:center;
    background:rgba(8,10,12,.66); z-index:10; }
  #confirm .ccard { background:rgba(18,24,20,.98); border-radius:18px; padding:22px 22px 18px;
    width:min(380px, 88vw); text-align:center; box-shadow:0 12px 34px rgba(0,0,0,.55); }
  #cmsg { color:#fff; font-size:16px; line-height:1.4; font-weight:600; margin-bottom:18px; }
  #confirm .crow { display:flex; gap:12px; justify-content:center; }
  #cno { font-size:14px; font-weight:800; border:2px solid #9fe6a0; border-radius:24px;
    padding:11px 22px; background:transparent; color:#9fe6a0; flex:1; }
  #cyes { font-size:14px; font-weight:800; border:none; border-radius:24px;
    padding:11px 22px; background:#e8745f; color:#fff; flex:1; }
  #dev { position:fixed; top:4px; left:4px; color:#0f0; font:12px monospace; display:none; z-index:50;
    background:rgba(0,0,0,.5); padding:2px 6px; }

  #garage { position:absolute; inset:0; display:none; align-items:center; justify-content:center;
    background:rgba(12,16,20,.55); }
  #garage .gcard { background:rgba(18,24,20,.96); border-radius:18px; padding:18px 20px 16px;
    width:min(420px, 90vw); text-align:center; box-shadow:0 10px 30px rgba(0,0,0,.45); }
  #gtitle { color:#ffc966; font-weight:800; font-size:15px; text-transform:uppercase;
    letter-spacing:1px; margin-bottom:12px; }
  #gstats { margin-bottom:14px; }
  #gstats .grow { display:flex; align-items:center; gap:10px; margin:5px 0; }
  #gstats .grow span { color:#cfe; font-size:11px; font-weight:700; width:74px; text-align:right;
    text-transform:uppercase; letter-spacing:.5px; }
  #gstats .gbar { flex:1; height:9px; border-radius:5px; background:rgba(255,255,255,.14); overflow:hidden; }
  #gstats .gbar i { display:block; height:100%; border-radius:5px;
    background:linear-gradient(90deg,#9fe6a0,#ffd166); }
  #gstats .gperk { margin-top:9px; color:#ffd9a0; font-size:12px; font-weight:700; }
  #gbuy { font-size:15px; font-weight:800; letter-spacing:1px; border:none; border-radius:24px;
    padding:11px 34px; background:#9fe6a0; color:#15321b; margin-bottom:14px; }
  #gmods { display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin-bottom:13px; }
  #gmods button { font-size:11px; font-weight:700; border:2px solid #9fe6a0; border-radius:18px;
    padding:8px 12px; background:transparent; color:#9fe6a0; }
  #gmods button:active { transform:scale(.94); }
  #gswatches { display:flex; flex-wrap:wrap; gap:12px; justify-content:center; margin-bottom:16px; }
  #garage .gsw { width:46px; height:46px; border-radius:50%; border:3px solid rgba(255,255,255,.25);
    box-shadow:0 2px 8px rgba(0,0,0,.35); cursor:pointer; }
  #garage .gsw:active { transform:scale(.92); }
  #gdone { font-size:15px; font-weight:800; letter-spacing:1px; border:none; border-radius:24px;
    padding:11px 34px; background:#ffd166; color:#3d2410; }

  #stats { position:absolute; inset:0; display:none; align-items:center; justify-content:center;
    background:rgba(12,16,20,.6); }
  #stats .scard { background:rgba(18,24,20,.97); border-radius:18px; padding:18px 20px 16px;
    width:min(440px, 92vw); max-height:86vh; box-shadow:0 10px 30px rgba(0,0,0,.5);
    position:relative; display:flex; flex-direction:column; }
  #stbody { overflow-y:auto; min-height:0; }
  .gcard { position:relative; }
  .xclose { position:absolute; top:8px; right:10px; width:34px; height:34px; border-radius:50%;
    border:none; background:rgba(255,255,255,.14); color:#fff; font-size:15px; font-weight:800;
    line-height:1; z-index:3; }
  .xclose:active { transform:scale(.92); }
  #sttitle { color:#ffd166; font-weight:800; font-size:18px; letter-spacing:2px; text-align:center;
    margin-bottom:12px; }
  #stbody .sgrid { display:grid; grid-template-columns:1fr 1fr; gap:6px 14px; margin-bottom:14px; }
  #stbody .scell { display:flex; justify-content:space-between; font-size:13px; color:#e8efe6;
    border-bottom:1px solid rgba(255,255,255,.08); padding:4px 0; }
  #stbody .scell b { color:#9fe6a0; font-weight:700; }
  #stbody .shead { color:#ffc966; font-size:12px; font-weight:800; text-transform:uppercase;
    letter-spacing:1px; margin:4px 0 8px; }
  #stbody .ach { display:flex; align-items:center; gap:10px; margin:7px 0; opacity:.45; }
  #stbody .ach.on { opacity:1; }
  #stbody .ach .amark { width:26px; height:26px; border-radius:50%; flex:none; text-align:center;
    line-height:26px; font-size:14px; background:rgba(255,255,255,.1); }
  #stbody .ach.on .amark { background:#ffd166; }
  #stbody .ach .atext b { display:block; color:#fff; font-size:13px; }
  #stbody .ach .atext span { color:#bcd; font-size:11px; }
  #stats .srow2 { display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin-top:6px; }
  #stweather { font-size:12px; font-weight:700; border:2px solid #7fb0e6; border-radius:24px;
    padding:9px 16px; background:transparent; color:#9fc4ee; }
  #stclose { font-size:15px; font-weight:800; letter-spacing:1px; border:none; border-radius:24px;
    padding:11px 34px; background:#ffd166; color:#3d2410; }
  #streset { font-size:12px; font-weight:700; border:2px solid #e8745f; border-radius:24px;
    padding:9px 20px; background:transparent; color:#e8745f; }
  #stbloom { font-size:12px; font-weight:700; border:2px solid #9fe6a0; border-radius:24px;
    padding:9px 18px; background:transparent; color:#9fe6a0; }
</style>
</head>
<body>
<div id="ui">
  <div id="flash"></div>
  <div id="vignette"></div>
  <div id="topbar">
    <div id="moneybox"><div id="money"></div><div id="income"></div><div id="palms"></div></div>
    <div id="missionbox"><div id="mtitle"></div><div id="mstep"></div></div>
    <canvas id="minimap" width="132" height="132"></canvas>
    <button id="statsbtn" class="pe">🏆</button>
    <button id="photobtn" class="pe">📷</button>
    <button id="mute" class="pe"></button>
  </div>
  <div id="toast"></div>
  <div id="wanted"></div>
  <div id="joy"><div id="knob"></div></div>
  <button id="btnB" class="btn pe"></button>
  <button id="brake" class="btn pe">BRAKE</button>
  <button id="boost" class="btn pe">BOOST</button>
  <button id="btnA" class="btn pe"></button>
  <canvas id="speedo" width="92" height="92"></canvas>
  <div id="dialogue" class="pe"><div id="dwho"></div><div id="dtext"></div><div id="dhint"></div></div>
  <div id="intro" class="pe"></div>
  <div id="garage" class="pe"><div class="gcard"><button id="gx" class="xclose">✕</button><div id="gtitle"></div><div id="gstats"></div><button id="gbuy"></button><div id="gmods"><button id="gmEngine"></button><button id="gmTurbo"></button><button id="gmTyres"></button></div><div id="gswatches"></div><button id="gdone"></button></div></div>
  <div id="stats" class="pe"><div class="scard"><button id="stx" class="xclose">✕</button><div id="sttitle"></div><div id="stbody"></div><div class="srow2"><button id="stbloom"></button><button id="stweather"></button><button id="streset"></button><button id="stclose"></button></div></div></div>
  <div id="confirm" class="pe"><div class="ccard"><div id="cmsg"></div><div class="crow"><button id="cno"></button><button id="cyes"></button></div></div></div>
  <button id="photoclose" class="pe">✕ Photo</button>
</div>
<div id="dev"></div>
<script type="importmap">
{ "imports": {
  "three": "./vendor/three.module.js",
  "three/examples/jsm/loaders/GLTFLoader.js": "./vendor/GLTFLoader.js"
} }
</script>
<script type="module" src="./game.js"></script>
</body>
</html>
