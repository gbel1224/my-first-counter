<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Camellia City — Explore</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>🌆</text></svg>">
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#9fc6e8;font-family:system-ui,Segoe UI,Roboto,sans-serif;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
  canvas{display:block}
  #load{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:linear-gradient(#0d1622,#16263a);color:#cfe2f5;z-index:50}
  #load h1{margin:0;font-size:20px;letter-spacing:2px;font-weight:700}
  #bar{width:220px;height:8px;border-radius:6px;background:rgba(255,255,255,.12);overflow:hidden}
  #fill{height:100%;width:0;background:linear-gradient(90deg,#5aa9e6,#7ee0c6);transition:width .2s}
  #sub{font-size:12px;opacity:.7}
  #hint{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);color:#fff;font-size:12px;background:rgba(10,16,24,.55);padding:7px 12px;border-radius:20px;z-index:20;text-align:center;line-height:1.5}
  #back{position:fixed;left:12px;top:12px;z-index:30;color:#fff;text-decoration:none;font-size:13px;background:rgba(10,16,24,.6);padding:8px 13px;border-radius:20px;border:1px solid rgba(255,255,255,.18)}
  #ui{position:fixed;inset:0;z-index:15;pointer-events:none}
  .pad{position:absolute;bottom:26px;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.16);pointer-events:auto;touch-action:none}
  #moveBase{left:24px}#lookBase{right:24px}
  .nub{position:absolute;left:50%;top:50%;width:50px;height:50px;margin:-25px 0 0 -25px;border-radius:50%;background:rgba(255,255,255,.28);border:1px solid rgba(255,255,255,.4)}
  .vbtn{position:absolute;right:160px;width:54px;height:54px;border-radius:50%;font-size:22px;color:#fff;background:rgba(10,16,24,.55);border:1px solid rgba(255,255,255,.2);pointer-events:auto;touch-action:none}
  #up{bottom:96px}#dn{bottom:30px}
  @media(hover:hover) and (pointer:fine){.pad,.vbtn{display:none}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<a id="back" href="./play.html">← Back to the game</a>
<div id="ui">
  <div id="moveBase" class="pad"><div class="nub" id="moveNub"></div></div>
  <div id="lookBase" class="pad"><div class="nub" id="lookNub"></div></div>
  <button id="up" class="vbtn">▲</button>
  <button id="dn" class="vbtn">▼</button>
</div>
<div id="hint">Desktop: <b>WASD</b> move · <b>drag mouse</b> look · <b>Q/E</b> up/down · <b>Shift</b> boost</div>
<div id="load"><h1>CAMELLIA CITY</h1><div id="bar"><div id="fill"></div></div><div id="sub">loading model… (9 MB, may take a moment)</div></div>

<script type="module">
import * as THREE from './vendor/three.module.js';
import { FBXLoader } from './vendor/fbx/FBXLoader.js';

const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x9fc6e8);
scene.fog = new THREE.Fog(0x9fc6e8, 30000, 220000);

scene.add(new THREE.HemisphereLight(0xeaf4ff, 0x47526a, 1.15));
const sun = new THREE.DirectionalLight(0xfff1d8, 2.1);
sun.position.set(0.5, 1, 0.35);
scene.add(sun);
scene.add(new THREE.AmbientLight(0xffffff, 0.3));

const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 1, 600000);

function resize() { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); }
addEventListener('resize', resize); resize();

// ---- load FBX ----
const fill = document.getElementById('fill'), sub = document.getElementById('sub'), load = document.getElementById('load');
let ready = false, center = new THREE.Vector3(), radius = 1000;
new FBXLoader().load('./Camellia_City.fbx', (obj) => {
  obj.traverse(o => {
    if (o.isMesh) {
      const mats = Array.isArray(o.material) ? o.material : [o.material];
      mats.forEach(m => { if (m) { if (m.color && m.color.getHex() === 0x000000) m.color.setHex(0xb9bfc6); m.side = THREE.DoubleSide; } });
      o.castShadow = o.receiveShadow = false;
    }
  });
  scene.add(obj);
  const box = new THREE.Box3().setFromObject(obj);
  box.getCenter(center);
  const size = new THREE.Vector3(); box.getSize(size);
  radius = Math.max(size.x, size.z) * 0.5;
  sun.position.set(center.x + radius, center.y + radius * 1.4, center.z + radius * 0.6);
  // start: a cinematic 3/4 aerial just outside the city, looking at the centre
  cam.pos.set(center.x + radius * 0.9, center.y + radius * 0.7, center.z + radius * 0.9);
  aimAt(center);
  ready = true;
  load.style.opacity = '0'; load.style.transition = 'opacity .6s'; setTimeout(() => load.remove(), 700);
}, (e) => { if (e.total) { const p = e.loaded / e.total; fill.style.width = (p * 100 | 0) + '%'; sub.textContent = 'loading model… ' + (p * 100 | 0) + '%'; } },
   (err) => { sub.textContent = 'failed to load: ' + ((err && err.message) || err); });

// ---- free-fly camera ----
const cam = { pos: new THREE.Vector3(0, 4000, 8000), yaw: 0, pitch: -0.3 };
function aimAt(t) { const d = t.clone().sub(cam.pos); cam.yaw = Math.atan2(d.x, d.z); cam.pitch = Math.atan2(d.y, Math.hypot(d.x, d.z)); }
const keys = new Set();
addEventListener('keydown', e => keys.add(e.code));
addEventListener('keyup', e => keys.delete(e.code));

// mouse drag look (desktop)
let dragging = false, px = 0, py = 0;
canvas.addEventListener('pointerdown', e => { dragging = true; px = e.clientX; py = e.clientY; });
addEventListener('pointerup', () => dragging = false);
addEventListener('pointermove', e => { if (!dragging) return; cam.yaw -= (e.clientX - px) * 0.005; cam.pitch = clamp(cam.pitch - (e.clientY - py) * 0.005, -1.4, 1.4); px = e.clientX; py = e.clientY; });
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;

// touch joysticks (mobile)
const move = { x: 0, y: 0 }, look = { x: 0, y: 0 };
function joystick(baseId, nubId, out) {
  const base = document.getElementById(baseId), nub = document.getElementById(nubId);
  let id = null, cx = 0, cy = 0;
  base.addEventListener('pointerdown', e => { id = e.pointerId; const r = base.getBoundingClientRect(); cx = r.left + r.width / 2; cy = r.top + r.height / 2; base.setPointerCapture(id); e.preventDefault(); });
  base.addEventListener('pointermove', e => {
    if (e.pointerId !== id) return;
    let dx = e.clientX - cx, dy = e.clientY - cy; const m = Math.hypot(dx, dy), max = 45;
    if (m > max) { dx *= max / m; dy *= max / m; }
    nub.style.transform = `translate(${dx}px,${dy}px)`; out.x = dx / max; out.y = dy / max;
  });
  const end = e => { if (e.pointerId !== id) return; id = null; out.x = out.y = 0; nub.style.transform = ''; };
  base.addEventListener('pointerup', end); base.addEventListener('pointercancel', end);
}
joystick('moveBase', 'moveNub', move);
joystick('lookBase', 'lookNub', look);
let vbtn = 0;
const hold = (el, v) => { el.addEventListener('pointerdown', e => { vbtn = v; e.preventDefault(); }); el.addEventListener('pointerup', () => vbtn = 0); el.addEventListener('pointercancel', () => vbtn = 0); };
hold(document.getElementById('up'), 1); hold(document.getElementById('dn'), -1);

const fwd = new THREE.Vector3(), right = new THREE.Vector3(), up = new THREE.Vector3(0, 1, 0);
let last = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  // look input
  cam.yaw -= look.x * dt * 2.2;
  cam.pitch = clamp(cam.pitch - look.y * dt * 2.0, -1.4, 1.4);
  // movement
  const spd = radius * (keys.has('ShiftLeft') || keys.has('ShiftRight') ? 1.4 : 0.55) * dt;
  fwd.set(Math.sin(cam.yaw) * Math.cos(cam.pitch), Math.sin(cam.pitch), Math.cos(cam.yaw) * Math.cos(cam.pitch)).normalize();
  right.crossVectors(fwd, up).normalize();
  let f = 0, s = 0, v = vbtn;
  if (keys.has('KeyW') || keys.has('ArrowUp')) f += 1;
  if (keys.has('KeyS') || keys.has('ArrowDown')) f -= 1;
  if (keys.has('KeyD') || keys.has('ArrowRight')) s += 1;
  if (keys.has('KeyA') || keys.has('ArrowLeft')) s -= 1;
  if (keys.has('KeyE') || keys.has('Space')) v += 1;
  if (keys.has('KeyQ')) v -= 1;
  f -= move.y; s += move.x;
  cam.pos.addScaledVector(fwd, f * spd);
  cam.pos.addScaledVector(right, s * spd);
  cam.pos.y += v * spd;
  camera.position.copy(cam.pos);
  camera.lookAt(cam.pos.x + fwd.x, cam.pos.y + fwd.y, cam.pos.z + fwd.z);
  renderer.render(scene, camera);
}
requestAnimationFrame(frame);
globalThis.__cam = cam; globalThis.__ready = () => ready;
</script>
</body>
</html>
